# Build jobs derived by scripts/outfit/release-workflow.mjs from upstream release workflows.
name: TauriTavern-Lucky - All Upstream Targets
on:
  workflow_dispatch: null
  push:
    branches:
      - feat/outfit-manager-bundled
permissions:
  contents: read
concurrency:
  group: outfit-bundles-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  TAURITAVERN_BUILD_BRANCH: tauritavern-lucky
  TAURITAVERN_BUILD_REVISION: ${{ github.sha }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check complete upstream packaging coverage
        run: node scripts/outfit/release-workflow.mjs --check
      - name: Native filesystem and transport tests
        run: node --test scripts/outfit/*.test.mjs
      - name: Prepare pinned plugins and browser-compatible backend
        run: node scripts/outfit/prepare.mjs
      - name: Install Node-only dependencies for upstream test fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/outfit-test-deps" --ignore-scripts --no-audit --no-fund express@4.21.2
          ln -s "$RUNNER_TEMP/outfit-test-deps/node_modules" .outfit-build/backend/node_modules
      - name: Original server test suite
        working-directory: .outfit-build/backend
        run: npm test
      - name: Original frontend tests
        run: node --experimental-vm-modules --test .outfit-build/frontend/tests/*.test.cjs
      - name: Full bundled-backend integration test
        run: node scripts/outfit/smoke.mjs
      - name: Bundled BaiBai frontend integration test
        run: pnpm run web:build --config-name vendor-libs && node --experimental-vm-modules scripts/outfit/baibai-smoke.mjs
      - name: Verify Rust workspace boundaries
        run: node scripts/check-rust-crate-boundaries.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Outfit-Integration-Sources
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: |
            src/scripts/extensions/outfit-manager/
            src/scripts/extensions/baibai-tools/
            .outfit-build/BUILD-MANIFEST.json
            .outfit-build/tooling/package-lock.json
  desktop:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_args: ""
            artifact_prefix: ""
            cache_key: windows-x64
          - platform: windows-latest
            target_args: --debug --bundles nsis --features devtools-pilot
            artifact_prefix: debug-
          - platform: macos-latest
            target_args: --target x86_64-apple-darwin
            artifact_prefix: ""
            cache_key: macos-x64
          - platform: macos-latest
            target_args: --target x86_64-apple-darwin --debug --bundles app,dmg --features devtools-pilot
            artifact_prefix: debug-
          - platform: macos-latest
            target_args: --target aarch64-apple-darwin
            artifact_prefix: ""
            cache_key: macos-arm64
          - platform: macos-latest
            target_args: --target aarch64-apple-darwin --debug --bundles app,dmg --features devtools-pilot
            artifact_prefix: debug-
          - platform: ubuntu-22.04
            target_args: --bundles appimage,deb,rpm
            artifact_prefix: ""
            cache_key: linux-x64
          - platform: ubuntu-22.04-arm
            target_args: --bundles deb,rpm
            artifact_prefix: ""
            cache_key: linux-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf pkg-config rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-alsa gstreamer1.0-pulseaudio
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        if: matrix.cache_key
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.cache_key }}
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          args: ${{ matrix.target_args }} --config ${{ github.workspace }}/.outfit-build/tauri.outfit.desktop.conf.json
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: TauriTavern-Lucky-${{ matrix.artifact_prefix }}[platform]-[arch]-[bundle]
      - name: Verify macOS application architecture and signature
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |-
          set -euo pipefail
          case "${{ matrix.target_args }}" in *x86_64*) target=x86_64-apple-darwin; arch=x86_64;; *) target=aarch64-apple-darwin; arch=arm64;; esac
          case "${{ matrix.target_args }}" in *--debug*) profile=debug;; *) profile=release;; esac
          app="src-tauri/target/$target/$profile/bundle/macos/TauriTavern-Lucky.app"
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$executable" = 'tauritavern-lucky'
          file "$app/Contents/MacOS/$executable" | grep "$arch"
    timeout-minutes: 120
  portable:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
          - platform: ubuntu-22.04
            name: linux-x64
          - platform: ubuntu-22.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.name }}
          save-if: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Build portable binary
        run: node scripts/build-portable.mjs --output-dir portable -- --config .outfit-build/tauri.outfit.desktop.conf.json
      - name: Upload portable binary
        uses: actions/upload-artifact@v7
        with:
          name: TauriTavern-Lucky-${{ matrix.name }}-portable
          path: portable/*
          if-no-files-found: error
    timeout-minutes: 120
  mobile:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - mobile: android
            platform: ubuntu-latest
            args: --verbose --apk --split-per-abi --target aarch64 armv7
          - mobile: ios
            platform: macos-latest
            args: --verbose
            policy: standard
          - mobile: ios
            platform: macos-latest
            args: --verbose
            policy: ios_external_beta
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Android host dependencies
        if: matrix.mobile == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi' || 'aarch64-apple-ios' }}
      - name: Setup JDK
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties
      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true
      - name: Configure Android compiler
        if: matrix.mobile == 'android'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi24-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Enable HTTP access for standard mobile bundle
        run: ./scripts/ci/configure-mobile-http.sh enable "${{ matrix.mobile }}"
      - name: Configure APK signing
        env:
          OUTFIT_KEYSTORE: ${{ secrets.OUTFIT_ANDROID_KEYSTORE_BASE64 }}
          OUTFIT_KEY_ALIAS: ${{ secrets.OUTFIT_ANDROID_KEY_ALIAS }}
          OUTFIT_KEY_PASSWORD: ${{ secrets.OUTFIT_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/outfit-signing.jks"
          if [[ -n "$OUTFIT_KEYSTORE" ]]; then
            : "${OUTFIT_KEY_ALIAS:?Missing OUTFIT_ANDROID_KEY_ALIAS}"
            : "${OUTFIT_KEY_PASSWORD:?Missing OUTFIT_ANDROID_KEY_PASSWORD}"
            printf '%s' "$OUTFIT_KEYSTORE" | base64 --decode > "$keystore"
            signing_note='Signed with repository-owned Outfit key.'
          else
            OUTFIT_KEY_ALIAS=outfit-preview
            OUTFIT_KEY_PASSWORD=$(openssl rand -hex 24)
            export OUTFIT_KEY_PASSWORD
            echo "::add-mask::$OUTFIT_KEY_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype JKS \
              -alias "$OUTFIT_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass:env OUTFIT_KEY_PASSWORD -keypass:env OUTFIT_KEY_PASSWORD \
              -dname 'CN=TauriTavern Outfit Preview'
            signing_note='PREVIEW ONLY: temporary per-run signing key. Later builds cannot update this install unless the same signing key is configured. Export data before changing preview installations. No private signing key is published.'
            echo "::warning::$signing_note"
          fi
          prop=src-tauri/crates/tauritavern/gen/android/keystore.properties
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$OUTFIT_KEY_ALIAS" "$OUTFIT_KEY_PASSWORD" "$keystore" > "$prop"
          printf '%s\n' "$signing_note" > .outfit-build/ANDROID-SIGNING.txt
        if: matrix.mobile == 'android'
      - name: Build mobile bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ${{ matrix.mobile }}
          args: ${{ matrix.args }} --config ${{ github.workspace }}/.outfit-build/tauri.outfit.android.conf.json
          uploadWorkflowArtifacts: false
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
        if: matrix.mobile == 'android'
      - name: Verify Android signatures and package identity
        if: matrix.mobile == 'android'
        shell: bash
        run: |-
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          mapfile -t apks < <(find src-tauri/crates/tauritavern/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -F "package: name='com.kingming.tauritavern.outfit'" <<< "$badging"
            grep -F "application-label:'TauriTavern Lucky'" <<< "$badging"
          done
      - name: Name signed APK downloads
        if: matrix.mobile == 'android'
        run: node scripts/outfit/package-artifacts.mjs android
      - uses: actions/upload-artifact@v7
        if: matrix.mobile == 'android'
        with:
          name: TauriTavern-Lucky-android-apk
          include-hidden-files: true
          path: .outfit-build/packages/*.apk
          if-no-files-found: error
      - name: Build unsigned iOS archive
        if: matrix.mobile == 'ios'
        env:
          TAURITAVERN_IOS_POLICY_PROFILE: ${{ matrix.policy == 'standard' && 'full' || matrix.policy }}
        run: node scripts/tauri-app.mjs --prepare-frontend ios build ${{ matrix.args }} --target aarch64 --no-sign --archive-only --config "$PWD/.outfit-build/tauri.outfit.ios.conf.json"
      - name: Package unsigned IPA
        if: matrix.mobile == 'ios'
        shell: bash
        run: |-
          set -euo pipefail
          app=$(find src-tauri/crates/tauritavern/gen/apple -path '*.xcarchive/Products/Applications/*.app' -type d)
          test -n "$app"
          test "$(printf '%s\n' "$app" | wc -l | tr -d ' ')" = 1
          test "$(basename "$app")" = 'TauriTavern-Lucky.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 'TauriTavern Lucky'
          mkdir -p .outfit-build/ipa/Payload
          cp -R "$app" .outfit-build/ipa/Payload/
          (cd .outfit-build/ipa && ditto -c -k --keepParent Payload ../TauriTavern-Lucky-${{ matrix.policy }}-unsigned.ipa)
          printf '%s\n' 'Unsigned IPA: sign with your own Apple identity before installing. No TestFlight upload performed.' > .outfit-build/IOS-SIGNING.txt
      - uses: actions/upload-artifact@v7
        if: matrix.mobile == 'ios'
        with:
          name: TauriTavern-Lucky-ios-arm64-${{ matrix.policy }}-unsigned-ipa
          include-hidden-files: true
          path: |-
            .outfit-build/*.ipa
            .outfit-build/IOS-SIGNING.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.mobile == 'android'
        with:
          name: TauriTavern-Lucky-Android-Signing
          include-hidden-files: true
          path: .outfit-build/ANDROID-SIGNING.txt
          if-no-files-found: error
    timeout-minutes: 120
  flatpak:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Remove build-time plugin checkouts before offline packaging
        run: rm -rf .outfit-build
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder zstd
          flatpak --user remote-add \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache Flatpak SDK and build inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder/downloads
            .flatpak-builder/ccache
          key: flatpak-x86_64-${{ hashFiles('packaging/flatpak/com.tauritavern.client.yml', 'packaging/flatpak/*-sources.json', 'pnpm-lock.yaml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            flatpak-x86_64-
      - name: Build Flatpak application tree
        run: ./packaging/flatpak/build.sh
      - name: Archive Flatpak application tree
        run: |-
          flatpak build-export .outfit-flatpak-repo .flatpak-build
          flatpak build-bundle .outfit-flatpak-repo TauriTavern-Lucky-x86_64.flatpak com.tauritavern.client
      - name: Upload Flatpak build tree
        uses: actions/upload-artifact@v7
        with:
          name: TauriTavern-Lucky-linux-x64-flatpak
          path: "*.flatpak"
          if-no-files-found: error
    env:
      TAURITAVERN_FLATPAK_USER: "1"
  nix:
    needs: contracts
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-22.04
          - system: aarch64-linux
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Include generated extensions in Nix source snapshot
        run: git add -u && git add src/scripts/extensions/outfit-manager && git add -f src/scripts/extensions/baibai-tools
      - uses: cachix/install-nix-action@v31
      - name: Build release flake
        run: nix --accept-flake-config build .#tauritavern --print-build-logs
      - name: Export Nix closure
        run: |-
          sudo apt-get update && sudo apt-get install -y zstd
          nix-store --export $(nix-store --query --requisites ./result) | zstd -T0 > TauriTavern-Lucky-${{ matrix.system }}.nar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: TauriTavern-Lucky-${{ matrix.system }}-nix
          path: "*.nar.zst"
          if-no-files-found: error
    timeout-minutes: 120
  ohos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
    container:
      image: ghcr.io/leenhawk/tauri-harmony@sha256:01cfb6a9fa7fa35f1cf756fb89d4333d272820b66fe8dcf032375911eebddfdd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD"
      - run: pnpm install --frozen-lockfile
      - name: Bundle pinned Outfit and BaiBai extensions
        run: node scripts/outfit/prepare.mjs
      - name: Snapshot prepared OpenHarmony project
        run: git add src-tauri/crates/tauritavern/gen/ohos
      - run: python3 scripts/ohos/prepare.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ohos-hap-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build unsigned HAP
        run: |
          source scripts/ohos/env.sh
          # Keep the image's Node on PATH for pnpm and the frontend build.
          export PATH="$HARMONY_TOOLS_DIR/command-line-tools/bin:$PATH"
          config_args=(--config src-tauri/crates/tauritavern/tauri.ohos.conf.json)
          pnpm ohos build --ci --target "${TARGET_TRIPLE%%-*}" "${config_args[@]}" -- --lib
      - name: Validate HAP and application project
        run: |
          shopt -s nullglob
          haps=(src-tauri/crates/tauritavern/gen/ohos/entry/build/default/outputs/default/*.hap)
          test "${#haps[@]}" -eq 1
          python3 scripts/ohos/validate-hap.py --target "$TARGET_TRIPLE" "${haps[0]}"
          project=src-tauri/crates/tauritavern/gen/ohos
          git diff --exit-code -- "$project"
          changes=$(git ls-files --others --exclude-standard -- "$project")
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff -- "$project"
            exit 1
          fi
      - name: Name HAP download
        run: node scripts/outfit/package-artifacts.mjs ohos
      - uses: actions/upload-artifact@v7
        with:
          name: TauriTavern-Lucky-ohos-${{ matrix.arch }}-unsigned-hap
          path: .outfit-build/packages/*.hap
          if-no-files-found: error
          include-hidden-files: true
    needs: contracts
    env:
      TARGET_TRIPLE: ${{ matrix.arch }}-unknown-linux-ohos
